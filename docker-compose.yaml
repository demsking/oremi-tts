version: '3.8'
services:
  server:
    tty: true
    runtime: nvidia
    build:
      context: .
      # dockerfile: dev.Dockerfile
      args:
        TENSORFLOW_VERSION: 2.9.2-gpu
    volumes:
      - ./oremi_tts:/var/www/oremi_tts
      - ~/.cache/nltk_data:/home/mandela/nltk_data
      - ~/.cache/tensorflow_tts:/home/mandela/.cache/tensorflow_tts
    ports:
      - 5216:5215
    entrypoint: "flask --app server:app run -h :: -p 5215 --reload"
